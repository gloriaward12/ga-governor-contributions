<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governor Pulse — Reports</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--rail:#1F2A3A;--rail-2:#273448;--rail-ink:#E6EAF0;--rail-mute:#9AA5B5;--field:#EEF0F3;--paper:#FFFFFF;--ink:#1A1F2B;--ink2:#5B6472;--muted:#8A93A1;--rule:#D9DDE3;--rule-2:#EDF0F3;--gold:#B98A2F;--gold-2:#9A7224;--gold-wash:#FBF6E9;--s1:#2A6FD6;--good:#1F7A36;--crit:#B8322E;--radius:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);font:14px/1.5 "Public Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:var(--rail);color:var(--rail-ink);padding:16px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:20px;letter-spacing:-.02em}header .brand small{display:block;font-weight:400;color:var(--rail-mute);font-size:12.5px}
header nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header nav a{color:var(--rail-mute);text-decoration:none;padding:8px 10px;border-bottom:2px solid transparent;font-size:13.5px}
header nav a.on{color:#fff;border-bottom-color:var(--gold)}
main{padding:18px 22px 60px;max-width:1500px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}.sub{color:var(--ink2);margin:0 0 14px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.layout>*{min-width:0}
.results{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.results .bar{position:sticky;top:0;background:var(--paper);z-index:2;padding:4px 0 8px;margin:0 0 6px;border-bottom:1px solid var(--rule-2)}
.count{color:var(--ink2);font-size:12.5px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:14px}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 3px}
select,input[type=text],input[type=number],input[type=date],input[type=search]{width:100%;height:34px;border:1px solid var(--rule);border-radius:var(--radius);padding:0 8px;background:#fff}
.presets{display:flex;flex-direction:column;gap:4px}
.preset{text-align:left;background:none;border:1px solid var(--rule);border-radius:var(--radius);padding:7px 9px;cursor:pointer;font-size:13px}
.preset.on{border-color:var(--gold);background:var(--gold-wash)}.preset small{display:block;color:var(--ink2);font-size:11.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12.5px;max-height:220px;overflow:auto;border:1px solid var(--rule-2);padding:6px;border-radius:var(--radius)}
.cols label{display:flex;gap:5px;align-items:center;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:0 12px;height:32px;cursor:pointer;font-weight:500;font-size:13px}
.btn.primary{background:var(--rail);color:#fff;border-color:var(--rail)}
.btn:hover{border-color:var(--gold)}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--ink2);margin:0 4px 4px 0;background:var(--field)}
.chip b{color:var(--ink)}
.tw{overflow:auto;max-height:68vh;max-width:100%;border:1px solid var(--rule);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule-2);vertical-align:top}
td.t{max-width:260px;overflow-wrap:anywhere}
td.num,th.num,td.d,th{white-space:nowrap}
tbody tr:hover td{background:#FAFBFC}
th{position:sticky;top:0;background:var(--paper);z-index:1;font-weight:600;color:var(--ink2);cursor:pointer}
th.on{color:var(--ink)}.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
.note{color:var(--ink2);font-size:12.5px;margin:0 0 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--radius);font-size:13px;display:none;z-index:60}
.loading{padding:60px 20px;text-align:center;color:var(--ink2)}
@media (max-width:900px){.layout{grid-template-columns:1fr}main{padding:12px 12px 56px}.cols{max-height:160px}.results{padding:10px}.tw{max-height:60vh}}
@media print{header,.layout>.panel:first-child,.bar,.toast{display:none!important}main{padding:0;max-width:none}.layout{display:block}.tw{max-height:none;overflow:visible;border:0}th{position:static}body{font-size:11px}table{font-size:11px}.printhead{display:block!important}}
.printhead{display:none;margin:0 0 10px}.printhead h2{margin:0;font-size:18px}.printhead .m{color:var(--ink2);font-size:11px}
</style>
</head>
<body>
<header>
  <div class="brand">Governor Pulse <small>Finance: reports</small></div>
  <nav><a href="/">Public views</a><a href="/finance">Ask lists</a><a href="/finance/raised">Raised</a><a class="on" href="/finance/reports">Reports</a><a href="/api/login?logout=1">Sign out</a></nav>
</header>
<main id="main"><div class="loading">Loading…</div></main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/finance/reports.js"></script>
</body>
</html>
