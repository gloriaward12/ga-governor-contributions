<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governor Pulse — Finance</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--rail:#1F2A3A;--rail-2:#273448;--rail-ink:#E6EAF0;--rail-mute:#9AA5B5;--field:#EEF0F3;--paper:#FFFFFF;--ink:#1A1F2B;--ink2:#5B6472;--muted:#8A93A1;--rule:#D9DDE3;--rule-2:#EDF0F3;--gold:#B98A2F;--gold-2:#9A7224;--gold-wash:#FBF6E9;--s1:#2A6FD6;--s8:#C8413E;--seq400:#2A6FD6;--seq600:#1B4A91;--good:#1F7A36;--crit:#B8322E;--radius:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);font:14px/1.5 "Public Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:var(--rail);color:var(--rail-ink);padding:16px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:20px;letter-spacing:-.02em}header .brand small{display:block;font-weight:400;color:var(--rail-mute);font-size:12.5px}
header nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header nav a{color:var(--rail-mute);text-decoration:none;padding:8px 10px;border-bottom:2px solid transparent;font-size:13.5px}
header nav a.on{color:#fff;border-bottom-color:var(--gold)}
main{padding:18px 22px 60px;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}.sub{color:var(--ink2);margin:0 0 14px}
.notice{background:var(--gold-wash);border:1px solid #EAD9A8;border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:14px}
.kpis{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.tile{flex:1 1 170px;padding:14px 18px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-width:0}
.tile .l{font-size:12px;color:var(--ink2)}.tile .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:2px 0}.tile .d{font-size:12px;color:var(--muted)}
.kpis .tile:first-child{background:var(--gold-wash)}.kpis .tile:first-child .v{color:var(--gold-2);font-size:26px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
.card h3{margin:0 0 4px;font-size:15px}.note{color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.segs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto}
.seg{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink2);cursor:pointer;font-size:13.5px;margin-bottom:-1px;white-space:nowrap}
.seg.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.seg b{font-weight:600;color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
input[type=search]{height:34px;border:1px solid var(--rule);border-radius:var(--radius);padding:0 10px;min-width:240px}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:0 12px;height:32px;cursor:pointer;font-weight:500;font-size:13px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--rule);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{position:sticky;top:0;background:var(--paper);z-index:1;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
th.on{color:var(--ink)}.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--rule);color:var(--ink2);margin-left:4px;white-space:nowrap}
.pill.hot{border-color:#E8B4B2;color:var(--crit);background:#FDF3F2}.pill.ok{border-color:#BFE3C7;color:var(--good);background:#F0F9F2}
.loading{padding:60px 20px;text-align:center;color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--radius);font-size:13px;display:none;z-index:60}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:var(--ink2);font-size:12.5px;flex-wrap:wrap}
@media (max-width:640px){main{padding:12px 12px 56px}.tile{flex:1 1 44%}th,td{padding:7px 7px;font-size:12.5px}input[type=search]{min-width:0;width:100%}}
</style>
<link rel="stylesheet" href="/theme.css?v=3">
</head>
<body>
<header>
  <div class="brand">Governor Pulse <small>Finance: ask lists, capacity and fundraising intelligence</small></div>
  <nav><a href="/">Public views</a><a class="on" href="/finance">Ask lists</a><a href="/finance/raised">Raised</a><a href="/finance/reports">Reports</a><a href="/finance/screens">Screens</a><a href="/api/login?logout=1" id="out">Sign out</a></nav>
</header>
<main id="main"><div class="loading">Loading donor records…</div></main>
<div class="toast" id="toast"></div>
<script src="/finance/app.js?v=3"></script>
</body>
</html>
