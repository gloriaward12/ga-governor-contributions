<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Governor Pulse — Screens</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--rail:#1F2A3A;--rail-2:#273448;--rail-ink:#E6EAF0;--rail-mute:#9AA5B5;--field:#EEF0F3;--paper:#FFFFFF;--ink:#1A1F2B;--ink2:#5B6472;--muted:#8A93A1;--rule:#D9DDE3;--rule-2:#EDF0F3;--gold:#B98A2F;--gold-2:#9A7224;--gold-wash:#FBF6E9;--s1:#2A6FD6;--good:#1F7A36;--crit:#B8322E;--radius:3px}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);font:14px/1.5 "Public Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:var(--rail);color:var(--rail-ink);padding:16px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:20px;letter-spacing:-.02em}header .brand small{display:block;font-weight:400;color:var(--rail-mute);font-size:12.5px}
header nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
header nav a{color:var(--rail-mute);text-decoration:none;padding:8px 10px;border-bottom:2px solid transparent;font-size:13.5px}
header nav a.on{color:#fff;border-bottom-color:var(--gold)}
main{padding:18px 22px 60px;max-width:1300px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}.sub{color:var(--ink2);margin:0 0 14px;max-width:70ch}
.searchbox{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px}
.searchbox input{width:100%;height:44px;border:1px solid var(--rule);border-radius:var(--radius);padding:0 14px;font-size:16px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
.card h3{margin:0 0 4px;font-size:15px}.note{color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.hit{border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;margin-top:10px;background:#fff}
.hit h4{margin:0 0 6px;font-size:15px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px;margin:6px 0}
.fact .l{font-size:11.5px;color:var(--ink2)}.fact .v{font-weight:600;font-size:15px}.fact .d{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--rule);color:var(--ink2);margin-left:4px;white-space:nowrap}
.pill.hot{border-color:#E8B4B2;color:var(--crit);background:#FDF3F2}.pill.ok{border-color:#BFE3C7;color:var(--good);background:#F0F9F2}.pill.gold{border-color:#EAD9A8;color:var(--gold-2);background:var(--gold-wash)}
.segs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto}
.seg{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--ink2);cursor:pointer;font-size:13.5px;margin-bottom:-1px;white-space:nowrap}
.seg.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tw{overflow:auto;max-height:65vh;border:1px solid var(--rule);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
th{position:sticky;top:0;background:var(--paper);z-index:1;font-weight:600;color:var(--ink2);white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.muted{color:var(--muted)}.small{font-size:12px}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:0 12px;height:32px;cursor:pointer;font-weight:500;font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.kpis{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin-top:14px}
.tile{flex:1 1 170px;padding:14px 18px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-width:0}
.tile .l{font-size:12px;color:var(--ink2)}.tile .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:2px 0}.tile .d{font-size:12px;color:var(--muted)}
.loading{padding:60px 20px;text-align:center;color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--radius);font-size:13px;display:none;z-index:60}
a{color:var(--s1)}
@media (max-width:640px){main{padding:12px 12px 56px}.tile{flex:1 1 44%}th,td{padding:7px 7px;font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div class="brand">Governor Pulse <small>Finance: screens for appointments, contracts and lobbying</small></div>
  <nav><a href="/">Public views</a><a href="/finance">Ask lists</a><a href="/finance/raised">Raised</a><a href="/finance/reports">Reports</a><a class="on" href="/finance/screens">Screens</a><a href="/api/login?logout=1">Sign out</a></nav>
</header>
<main id="main"><div class="loading">Loading the registries…</div></main>
<div class="toast" id="toast"></div>
<script src="/finance/screens.js"></script>
</body>
</html>
